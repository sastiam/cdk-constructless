name: Feature request
description: Propose a new construct or prop
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What cost or security problem do you want to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Sketch the construct props and the resources it would create.
    validations:
      required: true
  - type: textarea
    id: cost
    attributes:
      label: Cost impact
      description: Does it create any resource with a fixed monthly cost?
